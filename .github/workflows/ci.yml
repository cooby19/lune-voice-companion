name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
      - run: brew install portaudio
      - run: uv sync --frozen --extra build
      - run: chflags -R nohidden .venv
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/lune
      - run: uv run pytest
      - run: uv run python scripts/secret_scan.py
      - run: uv run python -c "import py2app; import lune.app; import lune.engine"
      - run: uv run lune self-test
